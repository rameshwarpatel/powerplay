name: Update IPL form data

on:
  schedule:
    - cron: "30 21 * * *"   # 21:30 UTC = 3:00 AM IST (4:30 PM Toronto in winter, 5:30 PM in summer)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-form
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # keeps downloaded scorecards and Cricsheet files between runs (saves API hits)
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: form-cache-${{ github.run_id }}
          restore-keys: form-cache-

      - name: Fetch new matches and rebuild data
        env:
          CRICAPI_KEY: ${{ secrets.CRICAPI_KEY }}
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
        run: |
          if [ -n "$CRICAPI_KEY" ] || [ -n "$HIGHLIGHTLY_KEY" ]; then
            python3 scripts/update_form.py
          else
            echo "No API secrets set, using Cricsheet only."
            python3 scripts/update_form.py --no-api
          fi

      - name: Bump cache-busting version
        run: |
          V=$(date +%Y%m%d%H)
          sed -i -E "s#(data/(form|roster)\.js\?v=)[^\"]*#\1$V#" index.html

      # main is protected, so the daily refresh goes through a pull request like any other change
      - name: Commit to a branch and open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "powerplay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/form.js data/roster.js index.html
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            B="data/auto-update-$(date -u +%Y%m%d-%H%M)"
            git switch -c "$B"
            git commit -m "Update form data $(date -u +%F)"
            git push -u origin "$B"
            gh pr create --base main --head "$B" --title "Update form data $(date -u +%F)" --body "Automated daily refresh of match data."
            gh pr merge "$B" --squash --delete-branch
          fi
